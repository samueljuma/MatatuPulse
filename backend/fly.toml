# MatatuPulse API on Fly.io. Reuses the team's app and Postgres (mat3route-db).
# First time:  fly secrets set SECRET_KEY=... THRIVEWAVE_API_KEY=... (see README)
app = "mat3route-api"
primary_region = "jnb"

[build]
  dockerfile = "Dockerfile"

[deploy]
  # Migrate, then seed demo routes + import the real catalogue (idempotent, no SMS replay).
  release_command = "sh -c 'python manage.py migrate --noinput && python manage.py seed_demo --no-replay'"

[env]
  PORT = "8080"
  DEBUG = "false"
  DEMO_MODE = "true"
  SMS_PROVIDER = "thrivewave"
  ALLOWED_HOSTS = "mat3route-api.fly.dev"
  CSRF_TRUSTED_ORIGINS = "https://mat3route-api.fly.dev"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"
    [http_service.checks.headers]
      X-Forwarded-Proto = "https"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
